name: Report a bug
description: Report a Triton compilation, launch or numerical failure
labels: ["bug"]

body:
- type: markdown
  attributes:
    value: |
      Include the kernel, launch configuration and complete diagnostic.
      Specify whether the standard Triton or Weft model is affected.
- type: textarea
  attributes:
    label: Describe the bug
    description: |
      Please provide a clear and concise description of what the bug is.

      If relevant, add a [minimal complete example](https://stackoverflow.com/help/minimal-reproducible-example) that reproduces the bug. It is very important for the snippet to be as simple as possible, so please take time to trim down any irrelevant code to help us debug efficiently. We are going to copy-paste your code and we expect to get the same result as you did, so include both the kernel and launching code as well as any relevant imports.

      If the code is too long (hopefully, it isn't), feel free to put it in a public gist and link it in the issue: https://gist.github.com.

      Please also paste or describe the results you observe instead of the expected results. If you observe an error, please paste the error message including the **full** traceback of the exception. It may be relevant to wrap error messages in ```` ```triple quotes blocks``` ````.
    placeholder: |
      A clear and concise description of what the bug is.

      ```python
      # Sample code to reproduce the problem
      ```

      ```
      The error message you got, with the full traceback.
      ```
  validations:
    required: true
- type: textarea
  attributes:
    label: Environment details
    description: |
      Include the Triton build, Python, CPU or GPU, target ISA and compiler toolchain.
    placeholder: |
        Triton: ...
        Model and target: ...
        Toolchain: ...
  validations:
    required: true
