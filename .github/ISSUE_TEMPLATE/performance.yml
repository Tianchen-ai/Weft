name: Report a performance issue
description: Report slow generated code or launch overhead
labels: ["performance"]

body:
- type: markdown
  attributes:
    value: |
      Include the workload, target, reference implementation and timing scope.
      Separate native kernel, complete launch and model measurements.
      For Weft, link the relevant Bench output and generated IR/C when available.
- type: textarea
  attributes:
    label: Describe the issue
    description: |
      Please provide a clear and concise description of the issue.

      Include a [minimal complete example](https://stackoverflow.com/help/minimal-reproducible-example) that reproduces the issue. It is very important for the snippet to be as simple as possible, so please take time to trim down any irrelevant code to help us debug efficiently. We are going to copy-paste your code and we expect to get the same result as you did.

      A reproducer could be a python program that runs a triton kernel and prints out the relevant suboptimal IR, or an IR file with an accompanying triton-opt command.

      If the code is too long (hopefully, it isn't), feel free to put it in a public gist and link it in the issue: https://gist.github.com.
    placeholder: |
      A clear and concise description of the issue.

      ```python
      # Sample code to reproduce the problem
      ```
  validations:
    required: true
- type: textarea
  attributes:
    label: Environment details
    description: |
      Include the Triton build, Python, CPU or GPU, target ISA and compiler toolchain.
    placeholder: |
        Triton: ...
        Model and target: ...
        Toolchain: ...
  validations:
    required: true
