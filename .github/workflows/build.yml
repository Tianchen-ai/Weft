name: Build Triton and Weft
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  wheel:
    runs-on: ubuntu-24.04
    env:
      TRITON_BUILD_PROTON: 'OFF'
      TRITON_APPEND_CMAKE_ARGS: '-DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_FLAGS=-Wno-error=deprecated-declarations'
      MAX_JOBS: 2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r python/requirements.txt build
      - name: Select the matching LLVM compiler
        run: |
          python python/build_helpers.py write_thirdparty_cmake_vars --triton-cache-path "$RUNNER_TEMP/triton-dependencies" --packages llvm --output "$RUNNER_TEMP/triton-llvm.cmake"
          python - <<'PY'
          import os
          import re
          from pathlib import Path
          settings = (Path(os.environ["RUNNER_TEMP"]) / "triton-llvm.cmake").read_text()
          matches = re.findall(r'^\s*set\(LLVM_SYSPATH "([^"]+)"\)$', settings, re.MULTILINE)
          if len(matches) != 1:
              raise RuntimeError("LLVM helper did not resolve one SDK")
          sdk = Path(matches[0])
          values = {"LLVM_SYSPATH": sdk, "CC": sdk / "bin/clang", "CXX": sdk / "bin/clang++"}
          for key, path in values.items():
              if not path.exists():
                  raise RuntimeError(f"missing {key}: {path}")
          with open(os.environ["GITHUB_ENV"], "a") as output:
              for key, path in values.items():
                  output.write(f"{key}={path}\n")
          PY
      - run: python -m build --wheel --no-isolation
      - run: python -m pip install --no-deps dist/*.whl
      - run: python -c "import triton; from triton._C.libtriton import weft; from triton.runtime.package import sdk_prefix; print(triton.__version__, sdk_prefix())"
      - uses: actions/upload-artifact@v4
        with:
          name: triton-host-compiler-wheel
          path: dist/*.whl
  handbook:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r third_party/weft/requirements-docs.txt
      - run: mkdocs build --strict -f third_party/weft/mkdocs.yml --site-dir ../../build/handbook
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: build/handbook
  publish-handbook:
    if: github.event_name != 'pull_request' && github.ref_name == github.event.repository.default_branch
    needs: handbook
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: handbook-pages
      cancel-in-progress: false
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
