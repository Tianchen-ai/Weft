<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="570" viewBox="0 0 1120 570" role="img" aria-labelledby="title desc">
  <title id="title">Triton Weft model compiler and application paths</title>
  <desc id="desc">An author program enters Canonical Kernel IR, then physical passes produce RISC-V Physical IR. Selected operations are emitted as C or local assembly and compiled into a native artifact used by Python, Torch, C/C++ or the llama.cpp adapter. Target capability facts inform physical compilation and execution checks.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#486174"/></marker>
    <style>
      text { font-family: system-ui, sans-serif; fill: #162f44; }
      .title { font-size: 24px; font-weight: 700; }
      .name { font-size: 19px; font-weight: 650; }
      .detail { font-size: 15px; }
      .note { font-size: 14px; fill: #486174; }
      .line { fill: none; stroke: #486174; stroke-width: 2; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect width="1120" height="570" rx="20" fill="#f4f7fa"/>
  <text x="36" y="46" class="title">Triton Weft model · two program IR layers</text>
  <text x="36" y="75" class="detail">Author numerical semantics → explicit physical decisions → ordinary native CPU calls</text>
  <rect x="36" y="109" width="222" height="107" rx="10" fill="#ffffff" stroke="#a2b5c5"/>
  <text x="54" y="141" class="name">Triton JITFunction</text>
  <text x="54" y="168" class="detail">Extended Python DSL</text>
  <text x="54" y="193" class="note">Values · levels · effects</text>
  <path d="M258 162 H294" class="line"/>
  <rect x="302" y="109" width="240" height="107" rx="10" fill="#e5f0ff" stroke="#6696c8"/>
  <text x="320" y="141" class="name">Canonical Kernel IR</text>
  <text x="320" y="168" class="detail">Preserve the author program</text>
  <text x="320" y="193" class="note">Numerical and storage contracts</text>
  <path d="M542 162 H594" class="line"/>
  <rect x="602" y="109" width="480" height="107" rx="10" fill="#def2ea" stroke="#63a38e"/>
  <text x="622" y="141" class="name">RISC-V Physical IR</text>
  <text x="622" y="168" class="detail">Passes select layout · memory · schedule · resources</text>
  <text x="622" y="193" class="note">Typed RVV / extension ops · final resource verification</text>
  <rect x="36" y="254" width="506" height="94" rx="10" fill="#ffffff" stroke="#a2b5c5"/>
  <text x="54" y="286" class="name">Target capability facts</text>
  <text x="54" y="314" class="detail">ISA · ABI · VLEN · local atoms · packing · resources</text>
  <path d="M542 290 H570 V190 H600" class="line"/>
  <path d="M842 218 V254" class="line"/>
  <rect x="602" y="262" width="480" height="86" rx="10" fill="#ffffff" stroke="#a2b5c5"/>
  <text x="622" y="292" class="name">Intrinsic C / typed local assembly</text>
  <text x="622" y="321" class="detail">Terminal spelling of already selected operations</text>
  <path d="M842 349 V389" class="line"/>
  <text x="622" y="379" class="note">Target Clang 23 · declared sysroot / runtime</text>
  <rect x="602" y="398" width="480" height="91" rx="10" fill="#fff0d9" stroke="#c3a36e"/>
  <text x="622" y="430" class="name">Native artifact + typed ABI</text>
  <text x="622" y="458" class="detail">Persistent cache · selected package · execution checks</text>
  <path d="M601 442 H550" class="line"/>
  <rect x="36" y="398" width="506" height="91" rx="10" fill="#ffffff" stroke="#a2b5c5"/>
  <text x="54" y="430" class="name">Applications</text>
  <text x="54" y="458" class="detail">Python / Torch · C / C++ SDK · llama.cpp adapter</text>
  <text x="36" y="535" class="note">JIT, finite autotuning and AOT share this path. Applications own tensors, model state and invocation order.</text>
</svg>
